<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Past Entries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FFFFFF;font-family:'Public Sans',sans-serif;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-shrink:0;padding:28px 24px 0 24px;display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="Journal.dc.html" aria-label="Back" style="text-decoration:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#18160F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 style="margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:#18160F;">Past Entries</h1>
    </div>
    <!-- One feed, newest first; the chips narrow it to one kind of entry. -->
    <div style="display:flex;background:#F1EADA;border-radius:14px;padding:4px;gap:4px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" style="flex:1;padding:9px 4px;border-radius:11px;border:none;background:{{f.bg}};color:{{f.color}};font-weight:700;font-size:12.5px;white-space:nowrap;">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 24px 24px 24px;display:flex;flex-direction:column;gap:20px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:10px;flex-shrink:0;">
        <span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#837C6D;">{{g.label}}</span>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="1">
          <div style="background:#F1EADA;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <span style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#2F6B5E;">{{it.kind}}</span>
              <span style="font-size:12px;color:#837C6D;font-weight:600;white-space:nowrap;">{{it.when}}</span>
            </div>

            <sc-if value="{{it.isExpression}}" hint-placeholder-val="{{false}}">
              <div style="display:flex;flex-direction:column;gap:10px;">
                <p style="margin:0;font-family:'Fraunces',serif;font-weight:500;font-size:16px;line-height:1.5;color:#18160F;white-space:pre-line;">{{it.text}}</p>
                <sc-if value="{{it.hasTag}}" hint-placeholder-val="{{false}}">
                  <span style="align-self:flex-start;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#FFFFFF;font-size:12px;font-weight:600;color:#2F6B5E;"><img src="{{it.tagIcon}}" alt="" style="width:12px;height:12px;">{{it.tagLabel}}</span>
                </sc-if>
              </div>
            </sc-if>

            <sc-if value="{{it.isReflection}}" hint-placeholder-val="{{true}}">
              <div style="display:flex;flex-direction:column;">
                <sc-for list="{{it.answers}}" as="a" hint-placeholder-count="2">
                  <div style="display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:{{a.border}};">
                    <span style="font-size:12.5px;font-weight:700;color:#837C6D;line-height:1.4;">{{a.question}}</span>
                    <span style="font-size:14.5px;color:#18160F;line-height:1.5;white-space:pre-line;">{{a.text}}</span>
                    <sc-if value="{{a.hasTag}}" hint-placeholder-val="{{false}}">
                      <span style="align-self:flex-start;display:flex;align-items:center;gap:6px;margin-top:2px;padding:4px 9px;border-radius:999px;background:#FFFFFF;font-size:11.5px;font-weight:600;color:#2F6B5E;"><img src="{{a.tagIcon}}" alt="" style="width:11px;height:11px;">{{a.tagLabel}}</span>
                    </sc-if>
                  </div>
                </sc-for>
                <sc-if value="{{it.canExpand}}" hint-placeholder-val="{{false}}">
                  <button type="button" onClick="{{it.toggle}}" style="align-self:flex-start;margin-top:4px;padding:4px 0;border:none;background:transparent;color:#2F6B5E;font-weight:700;font-size:12.5px;">{{it.toggleLabel}}</button>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin:24px 0 0;font-size:14px;color:#837C6D;line-height:1.5;text-align:center;">Nothing here yet. Your reflections and expressions will show up here after you save them.</p>
    </sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', expanded: {} };
  }
  renderVals() {
    const s = this.state;
    const TYPES = {
      'daily-reflection': { filter: 'daily', kind: 'DAILY REFLECTION' },
      'weekly-reflection': { filter: 'weekly', kind: 'WEEKLY REFLECTION' },
      expression: { filter: 'expression', kind: 'EXPRESSION' },
    };
    const FILTERS = [['all', 'All'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['expression', 'Expressions']];
    const SHOW = 3; // answers shown before "Show all"

    const tag = (id) => {
      const sym = id && content.symbols.find((x) => x.id === id);
      return sym ? { hasTag: true, tagLabel: sym.label, tagIcon: content.symbolIcon(sym.id, '#2F6B5E') } : { hasTag: false, tagLabel: '', tagIcon: '' };
    };

    // Newest first, grouped by the day each entry was written.
    const entries = db.list(null, { where: (e) => TYPES[e.type] && (s.filter === 'all' || TYPES[e.type].filter === s.filter) });
    const groups = [];
    entries.forEach((e) => {
      const day = db.iso(new Date(e.ts));
      let g = groups[groups.length - 1];
      if (!g || g.day !== day) {
        g = { day, label: (day === db.today() ? 'TODAY · ' : '') + db.format(day, { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase(), items: [] };
        groups.push(g);
      }
      const expanded = !!s.expanded[e.id];
      const all = (e.data.answers || []).filter((a) => a.text || a.tag);
      const shown = expanded ? all : all.slice(0, SHOW);
      g.items.push({
        kind: TYPES[e.type].kind + (e.type === 'weekly-reflection' && e.data.week ? ' · ' + db.weekLabel(e.data.week) : ''),
        when: new Date(e.ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
        isExpression: e.type === 'expression',
        isReflection: e.type !== 'expression',
        text: e.data.text || '',
        ...tag(e.data.tag),
        answers: shown.map((a, i) => ({
          question: a.question,
          text: a.text || '',
          border: i === 0 ? 'none' : '1px solid #E7DFCB',
          ...tag(a.tag),
        })),
        canExpand: all.length > SHOW,
        toggleLabel: expanded ? 'Show less' : 'Show all ' + all.length,
        toggle: () => this.setState({ expanded: { ...s.expanded, [e.id]: !expanded } }),
      });
    });

    return {
      filters: FILTERS.map(([id, label]) => ({
        label,
        bg: s.filter === id ? '#2F6B5E' : 'transparent',
        color: s.filter === id ? '#FFFFFF' : '#837C6D',
        pick: () => this.setState({ filter: id }),
      })),
      groups,
      empty: groups.length === 0,
    };
  }
}
</script>
</body>
</html>
