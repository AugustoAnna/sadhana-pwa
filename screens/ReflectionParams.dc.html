<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflection Parameters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FFFFFF;font-family:'Public Sans',sans-serif;}
  input{font-family:'Public Sans',sans-serif;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;gap:20px;padding:28px 24px 24px 24px;overflow:hidden;">

  <div style="display:flex;align-items:center;gap:12px;">
    <a href="Home.dc.html" aria-label="Back" style="text-decoration:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#18160F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 style="margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:#18160F;">Reflection Parameters</h1>
  </div>

  <div style="display:flex;background:#F1EADA;border-radius:14px;padding:4px;gap:4px;">
    <button type="button" onClick="{{pickDaily}}" style="flex:1;padding:10px;border-radius:11px;border:none;background:{{dailyTabBg}};color:{{dailyTabColor}};font-weight:700;font-size:13.5px;">Daily</button>
    <button type="button" onClick="{{pickWeekly}}" style="flex:1;padding:10px;border-radius:11px;border:none;background:{{weeklyTabBg}};color:{{weeklyTabColor}};font-weight:700;font-size:13.5px;">Weekly</button>
  </div>

  <span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#837C6D;">{{listLabel}}</span>

  <div style="flex:1;overflow-y:auto;">
    <div style="background:#F1EADA;border-radius:20px;padding:4px 6px;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:10px;padding:14px 10px;border-top:{{it.border}};">
          <span style="flex:1;font-size:14.5px;color:#18160F;line-height:1.4;">{{it.text}}</span>
          <button type="button" onClick="{{it.remove}}" aria-label="Remove" style="width:26px;height:26px;flex-shrink:0;border-radius:999px;border:none;background:#E9DFC9;display:flex;align-items:center;justify-content:center;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="#837C6D" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;gap:8px;">
      <input type="text" value="{{draft}}" onInput="{{setDraft}}" onKeyDown="{{onDraftKey}}" placeholder="e.g. How conscious was I while eating?" style="flex:1;padding:14px 16px;border-radius:14px;border:1.5px solid #E7DFCB;background:#FFFFFF;font-size:14.5px;color:#18160F;outline:none;">
      <button type="button" onClick="{{addItem}}" aria-label="Add parameter" style="width:48px;flex-shrink:0;border-radius:14px;border:none;background:#2F6B5E;color:#FFFFFF;font-size:22px;font-weight:600;">+</button>
    </div>
    <button type="button" onClick="{{save}}" style="width:100%;padding:16px;border-radius:14px;border:none;background:#18160F;color:#FFFFFF;font-weight:700;font-size:15.5px;">Save</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Edit a copy of the saved questions; Save writes both lists (the back arrow discards).
    this.state = {
      tab: 'daily',
      draft: '',
      daily: db.get('reflection.daily', content.dailyQuestions),
      weekly: db.get('reflection.weekly', content.weeklyQuestions),
    };
  }
  renderVals() {
    const s = this.state;
    const listKey = s.tab;
    const list = s[listKey];

    const pickDaily = () => this.setState({ tab: 'daily' });
    const pickWeekly = () => this.setState({ tab: 'weekly' });

    const setDraft = (e) => this.setState({ draft: e.target.value });
    const addItem = () => {
      const val = (s.draft || '').trim();
      if (!val) return;
      this.setState({ [listKey]: [...list, val], draft: '' });
    };

    const onDraftKey = (e) => { if (e.key === 'Enter') addItem(); };
    const save = () => {
      db.set('reflection.daily', s.daily);
      db.set('reflection.weekly', s.weekly);
      nav.back('Home.dc.html');
    };

    const items = list.map((text, i) => ({
      text,
      border: i === 0 ? 'none' : '1px solid #E7DFCB',
      remove: () => this.setState({ [listKey]: list.filter((_, j) => j !== i) }),
    }));

    return {
      dailyTabBg: s.tab === 'daily' ? '#2F6B5E' : 'transparent',
      dailyTabColor: s.tab === 'daily' ? '#FFFFFF' : '#837C6D',
      weeklyTabBg: s.tab === 'weekly' ? '#2F6B5E' : 'transparent',
      weeklyTabColor: s.tab === 'weekly' ? '#FFFFFF' : '#837C6D',
      listLabel: s.tab === 'daily' ? 'YOUR DAILY PARAMETERS' : 'YOUR WEEKLY PARAMETERS',
      items,
      draft: s.draft,
      setDraft,
      addItem,
      onDraftKey,
      save,
      pickDaily,
      pickWeekly,
    };
  }
}
</script>
</body>
</html>
