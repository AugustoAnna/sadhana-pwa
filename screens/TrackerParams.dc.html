<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracker Parameters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FFFFFF;font-family:'Public Sans',sans-serif;}
  input{font-family:'Public Sans',sans-serif;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;gap:16px;padding:28px 24px 24px 24px;overflow:hidden;">

  <div style="display:flex;align-items:center;gap:12px;">
    <a href="WeeklyTracker.dc.html" aria-label="Back" style="text-decoration:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#18160F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 style="margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:23px;color:#18160F;">Tracker Parameters</h1>
  </div>
  <span style="font-size:12.5px;color:#837C6D;line-height:1.4;">These are the rows on your Daily Tracker grid, top to bottom. Use the arrows to reorder.</span>

  <div style="flex:1;overflow-y:auto;">
    <div style="background:#F1EADA;border-radius:20px;padding:4px 10px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:8px;padding:12px 0;border-top:{{r.border}};">
          <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
            <button type="button" onClick="{{r.moveUp}}" aria-label="Move up" style="width:20px;height:16px;border:none;background:transparent;padding:0;opacity:{{r.upOpacity}};display:flex;align-items:center;justify-content:center;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 15L12 8L19 15" stroke="#837C6D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" onClick="{{r.moveDown}}" aria-label="Move down" style="width:20px;height:16px;border:none;background:transparent;padding:0;opacity:{{r.downOpacity}};display:flex;align-items:center;justify-content:center;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 9L12 16L19 9" stroke="#837C6D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <span style="font-size:10px;font-weight:700;color:#837C6D;width:40px;flex-shrink:0;line-height:1.2;">{{r.time}}</span>
          <span style="flex:1;font-size:14px;color:#18160F;font-weight:600;line-height:1.3;">{{r.name}}</span>
          <span style="font-size:10.5px;font-weight:700;color:#2F6B5E;background:#DCEBE5;padding:5px 8px;border-radius:999px;flex-shrink:0;">{{r.formatLabel}}</span>
          <button type="button" onClick="{{r.remove}}" aria-label="Remove" style="width:22px;height:22px;flex-shrink:0;border-radius:999px;border:none;background:#E9DFC9;display:flex;align-items:center;justify-content:center;">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="#837C6D" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;gap:8px;">
      <input type="text" value="{{time}}" onInput="{{setTime}}" placeholder="Time (optional)" style="width:110px;flex-shrink:0;padding:12px 12px;border-radius:14px;border:1.5px solid #E7DFCB;background:#FFFFFF;font-size:13px;color:#18160F;outline:none;">
      <input type="text" value="{{name}}" onInput="{{setName}}" onKeyDown="{{onNameKey}}" placeholder="New parameter name" style="flex:1;padding:12px 14px;border-radius:14px;border:1.5px solid #E7DFCB;background:#FFFFFF;font-size:14px;color:#18160F;outline:none;">
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <sc-for list="{{commonFormats}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" style="padding:9px 12px;border-radius:12px;border:1.5px solid {{f.border}};background:{{f.bg}};color:{{f.color}};font-weight:700;font-size:12.5px;">{{f.label}}</button>
      </sc-for>
      <button type="button" onClick="{{toggleMore}}" style="padding:9px 12px;border-radius:12px;border:1.5px solid #E7DFCB;background:#FFFFFF;color:#837C6D;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px;">
        More symbols
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" style="transform:{{moreRotate}};"><path d="M5 9L12 16L19 9" stroke="#837C6D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <sc-if value="{{showMore}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:2px;">
        <sc-for list="{{moreFormats}}" as="f" hint-placeholder-count="4">
          <button type="button" onClick="{{f.pick}}" style="padding:9px 12px;border-radius:12px;border:1.5px solid {{f.border}};background:{{f.bg}};color:{{f.color}};font-weight:700;font-size:12.5px;">{{f.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <button type="button" onClick="{{addRow}}" style="width:100%;padding:14px;border-radius:14px;border:1.5px solid #2F6B5E;background:transparent;color:#2F6B5E;font-weight:700;font-size:14.5px;">+ Add parameter</button>
    <button type="button" onClick="{{save}}" style="width:100%;padding:16px;border-radius:14px;border:none;background:#18160F;color:#FFFFFF;font-weight:700;font-size:15.5px;">Save</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      time: '',
      name: '',
      format: 'rating',
      showMore: false,
      // Edit a copy of the saved rows; Save writes them (the back arrow discards).
      rows: db.get('tracker.params', content.trackerParams),
    };
  }
  renderVals() {
    const s = this.state;
    // The common row is the fast path most people need day to day.
    // "More symbols" expands to the rest of the built-in library -- this list
    // is expected to grow over time as we ship new symbol types, without the
    // main row ever getting crowded.
    const commonDefs = [
      { key: 'arrow', label: '↑ / ↓' },
      { key: 'rating', label: '1–10' },
      { key: 'check', label: '✓ / –' },
      { key: 'number', label: '#' },
    ];
    const moreDefs = [
      { key: 'stars', label: '★ 1–5' },
      { key: 'yesno', label: 'Yes / No' },
      { key: 'percent', label: '%' },
      { key: 'duration', label: 'Duration' },
    ];
    const allDefs = [...commonDefs, ...moreDefs];
    const labelFor = (key) => (allDefs.find((f) => f.key === key) || allDefs[1]).label;

    const setTime = (e) => this.setState({ time: e.target.value });
    const setName = (e) => this.setState({ name: e.target.value });
    const toggleMore = () => this.setState({ showMore: !s.showMore });

    const makeChip = (f) => ({
      label: f.label,
      bg: s.format === f.key ? '#2F6B5E' : '#F1EADA',
      color: s.format === f.key ? '#FFFFFF' : '#18160F',
      border: s.format === f.key ? '#2F6B5E' : '#F1EADA',
      pick: () => this.setState({ format: f.key }),
    });
    const commonFormats = commonDefs.map(makeChip);
    const moreFormats = moreDefs.map(makeChip);

    const addRow = () => {
      const n = (s.name || '').trim();
      if (!n) return;
      // No time given -> defaults to "All day".
      const t = (s.time || '').trim() || 'All day';
      // Each row gets a stable id: values on the Daily Tracker are stored against it.
      const id = 'p' + Date.now().toString(36);
      this.setState({ rows: [...s.rows, { id, time: t, name: n, format: s.format }], name: '', time: '' });
    };
    const onNameKey = (e) => { if (e.key === 'Enter') addRow(); };
    const save = () => {
      db.set('tracker.params', s.rows);
      nav.back('WeeklyTracker.dc.html');
    };

    const swap = (i, j) => {
      const next = [...s.rows];
      const tmp = next[i];
      next[i] = next[j];
      next[j] = tmp;
      this.setState({ rows: next });
    };

    const rows = s.rows.map((r, i) => ({
      time: r.time,
      name: r.name,
      formatLabel: labelFor(r.format),
      border: i === 0 ? 'none' : '1px solid #E7DFCB',
      upOpacity: i === 0 ? 0.25 : 1,
      downOpacity: i === s.rows.length - 1 ? 0.25 : 1,
      moveUp: () => { if (i > 0) swap(i, i - 1); },
      moveDown: () => { if (i < s.rows.length - 1) swap(i, i + 1); },
      remove: () => this.setState({ rows: s.rows.filter((_, j) => j !== i) }),
    }));

    return { rows, commonFormats, moreFormats, showMore: s.showMore, moreRotate: s.showMore ? 'rotate(180deg)' : 'rotate(0deg)', toggleMore, time: s.time, name: s.name, setTime, setName, addRow, onNameKey, save };
  }
}
</script>
</body>
</html>
