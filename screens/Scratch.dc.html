<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scratch</title>
<script src="./support.js"></script>
</head>
<body>
<!--
  Scratch: a starting point for a new screen. Copy this file, rename it, and add it to screens.json.

  Template  {{name}} is a dotted lookup into what renderVals() returns (no expressions: compute them
            in renderVals). <sc-for list="{{items}}" as="it"> repeats, <sc-if value="{{flag}}"> shows or
            hides. Events are JSX-style: onClick="{{fn}}", onInput="{{fn}}", onKeyDown="{{fn}}".
  Data      db.get(key, fallback) / db.set(key, value)   one saved value (settings, current state)
            db.add(type, data) / db.list(type) / db.remove(id)   a tracked, time-stamped list
            The screen re-renders by itself whenever the database changes.
  Links     <a href="Home.dc.html">; links with aria-label="Back" go back in history.
-->
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FFFFFF;font-family:'Public Sans',sans-serif;}
  input{font-family:'Public Sans',sans-serif;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;gap:20px;padding:28px 24px 24px 24px;overflow:hidden;">

  <div style="display:flex;align-items:center;gap:12px;">
    <a href="Home.dc.html" aria-label="Back" style="text-decoration:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#18160F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1 style="margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:25px;color:#18160F;">Scratch</h1>
  </div>

  <!-- A saved value (kv) -->
  <div style="background:#F1EADA;border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;flex-direction:column;gap:4px;">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#837C6D;">COUNTER · SAVED IN KV</span>
      <span style="font-family:'Fraunces',serif;font-weight:600;font-size:32px;color:#18160F;">{{count}}</span>
    </div>
    <div style="display:flex;gap:8px;">
      <button type="button" onClick="{{reset}}" style="padding:10px 14px;border-radius:12px;border:1.5px solid #2F6B5E;background:transparent;color:#2F6B5E;font-weight:700;font-size:13px;">Reset</button>
      <button type="button" onClick="{{bump}}" style="padding:10px 16px;border-radius:12px;border:none;background:#2F6B5E;color:#FFFFFF;font-weight:700;font-size:13px;">+1</button>
    </div>
  </div>

  <!-- A tracked list (entries) -->
  <div style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;">
    <span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#837C6D;">NOTES · TRACKED AS ENTRIES</span>
    <div style="display:flex;gap:8px;">
      <input type="text" value="{{draft}}" onInput="{{setDraft}}" onKeyDown="{{onKey}}" placeholder="Write a note and press Enter" style="flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1.5px solid #E7DFCB;background:#FFFFFF;font-size:14.5px;color:#18160F;outline:none;">
      <button type="button" onClick="{{add}}" aria-label="Add note" style="width:48px;flex-shrink:0;border-radius:14px;border:none;background:#2F6B5E;color:#FFFFFF;font-size:22px;font-weight:600;">+</button>
    </div>
    <div style="flex:1;overflow-y:auto;">
      <div style="background:#F1EADA;border-radius:20px;padding:4px 14px;">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:10px;padding:13px 0;border-top:{{n.border}};">
            <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
              <span style="font-size:14.5px;color:#18160F;line-height:1.4;">{{n.text}}</span>
              <span style="font-size:11.5px;color:#837C6D;">{{n.when}}</span>
            </div>
            <button type="button" onClick="{{n.remove}}" aria-label="Remove note" style="width:24px;height:24px;flex-shrink:0;border-radius:999px;border:none;background:#E9DFC9;display:flex;align-items:center;justify-content:center;">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="#837C6D" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>
        </sc-for>
        <sc-if value="{{noNotes}}" hint-placeholder-val="{{false}}">
          <div style="padding:14px 0;font-size:13.5px;color:#837C6D;">No notes yet.</div>
        </sc-if>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // UI-only state (like a half-typed note) stays in this.state; anything to keep goes in db.
    this.state = { draft: '' };
  }
  renderVals() {
    const s = this.state;

    const count = db.get('scratch.count', 0);

    const list = db.list('scratch-note'); // newest first
    const notes = list.map((e, i) => ({
      text: e.data.text,
      when: new Date(e.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
      border: i === 0 ? 'none' : '1px solid #E7DFCB',
      remove: () => db.remove(e.id),
    }));

    const add = () => {
      const text = s.draft.trim();
      if (!text) return;
      db.add('scratch-note', { text });
      this.setState({ draft: '' });
    };

    return {
      count,
      // Read the current value inside the handler, not the one captured when this screen last rendered.
      bump: () => db.set('scratch.count', db.get('scratch.count', 0) + 1),
      reset: () => db.set('scratch.count', 0),
      notes,
      noNotes: notes.length === 0,
      draft: s.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') add(); },
      add,
    };
  }
}
</script>
</body>
</html>
