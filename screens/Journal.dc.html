<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FFFFFF;font-family:'Public Sans',sans-serif;}
  [data-quotes]::-webkit-scrollbar{display:none;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex:1;overflow-y:auto;padding:28px 24px 20px 24px;display:flex;flex-direction:column;gap:18px;">

    <h1 style="margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:#18160F;">Journal</h1>

    <!-- This month's entries by kind, laid out like the stats on the iPhone Journal app.
         Each one opens Past Entries showing just that kind (History.dc.html?filter=...). -->
    <div style="flex-shrink:0;display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:12px;font-weight:700;letter-spacing:.04em;color:#837C6D;">THIS MONTH</span>
      <div style="display:flex;align-items:center;">
        <a href="History.dc.html?filter=daily" aria-label="Past daily reflections" style="text-decoration:none;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <span style="display:flex;align-items:center;gap:7px;">
            <img src="../images/journal/daily-reflection.svg" alt="" style="width:22px;height:22px;flex-shrink:0;border-radius:6px;display:block;">
            <span style="font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.15;color:#18160F;">{{dailyCount}}</span>
          </span>
          <span style="font-size:13px;color:#837C6D;white-space:nowrap;">Daily</span>
        </a>
        <span style="width:1px;align-self:stretch;margin:4px 16px;background:#E7DFCB;flex-shrink:0;"></span>
        <a href="History.dc.html?filter=weekly" aria-label="Past weekly reflections" style="text-decoration:none;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <span style="display:flex;align-items:center;gap:7px;">
            <img src="../images/journal/weekly-reflection.svg" alt="" style="width:22px;height:22px;flex-shrink:0;border-radius:6px;display:block;">
            <span style="font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.15;color:#18160F;">{{weeklyCount}}</span>
          </span>
          <span style="font-size:13px;color:#837C6D;white-space:nowrap;">Weekly</span>
        </a>
        <span style="width:1px;align-self:stretch;margin:4px 16px;background:#E7DFCB;flex-shrink:0;"></span>
        <a href="History.dc.html?filter=expression" aria-label="Past expressions" style="text-decoration:none;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <span style="display:flex;align-items:center;gap:7px;">
            <img src="../images/journal/expressions.svg" alt="" style="width:22px;height:22px;flex-shrink:0;border-radius:6px;display:block;">
            <span style="font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.15;color:#18160F;">{{expressionCount}}</span>
          </span>
          <span style="font-size:13px;color:#837C6D;white-space:nowrap;">{{expressionLabel}}</span>
        </a>
      </div>
    </div>

    <div style="background:#F1EADA;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0;">
      <div style="position:relative;width:100%;height:130px;">
        <img src="../images/journal.jpg" alt="Sadhguru" style="width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;">
      </div>
      <!-- Quote of the day (lib/quotes.js), newest first: swipe, or use the arrows, for earlier days. -->
      <div style="padding:14px 0 12px 0;display:flex;flex-direction:column;gap:10px;">
        <div data-quotes onScroll="{{onQuotesScroll}}" style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;">
          <sc-for list="{{quoteSlides}}" as="q" hint-placeholder-count="1">
            <div style="flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding:0 18px;display:flex;flex-direction:column;gap:8px;">
              <span style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#2F6B5E;">{{q.label}}</span>
              <p style="margin:0;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:15.5px;line-height:1.45;color:#18160F;">{{q.text}}</p>
              <span style="font-size:12px;color:#837C6D;">{{q.by}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;">
          <span style="font-size:12px;color:#837C6D;">{{quoteHint}}</span>
          <div style="display:flex;gap:8px;">
            <button type="button" onClick="{{quotePrev}}" aria-label="Newer quote" style="width:30px;height:30px;border-radius:999px;border:none;padding:0;background:#FFFFFF;opacity:{{quotePrevOpacity}};display:flex;align-items:center;justify-content:center;">
              <svg width="8" height="12" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7L7 13" stroke="#2F6B5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" onClick="{{quoteNext}}" aria-label="Earlier quote" style="width:30px;height:30px;border-radius:999px;border:none;padding:0;background:#FFFFFF;opacity:{{quoteNextOpacity}};display:flex;align-items:center;justify-content:center;">
              <svg width="8" height="12" viewBox="0 0 8 14" fill="none"><path d="M1 1L7 7L1 13" stroke="#2F6B5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- My Commitment: shows whether it's signed and a line to come back to; opens the letter. -->
    <a href="CommitmentLetter.dc.html" style="text-decoration:none;flex-shrink:0;display:flex;flex-direction:column;gap:12px;background:#F1EADA;border-radius:20px;padding:16px 18px;">
      <span style="display:flex;align-items:center;gap:12px;">
        <img src="../images/journal/commitment.svg" alt="" style="width:40px;height:40px;flex-shrink:0;border-radius:11px;display:block;">
        <span style="flex:1;display:flex;flex-direction:column;">
          <span style="font-size:15px;font-weight:700;color:#18160F;">My Commitment</span>
          <span style="font-size:12.5px;color:#837C6D;">{{commitStatus}}</span>
        </span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1L7 7L1 13" stroke="#837C6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span style="font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:15px;line-height:1.45;color:#18160F;">{{commitPreview}}</span>
    </a>

    <!-- Journal tools. Daily Reflection (which now includes mood & energy and the daily tracker)
         runs across the top; Weekly Reflection and Expressions sit below as squares. -->
    <div style="flex-shrink:0;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;">
      <a href="DailyReflection.dc.html" style="text-decoration:none;grid-column:1 / -1;aspect-ratio:2 / 1;box-sizing:border-box;background:#F1EADA;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;">
        <img src="../images/journal/daily-reflection.svg" alt="" style="width:64px;height:64px;border-radius:17px;display:block;">
        <span style="font-size:15px;font-weight:700;color:#18160F;line-height:1.25;">Daily Reflection</span>
      </a>
      <a href="WeeklyReflection.dc.html" style="text-decoration:none;aspect-ratio:1;box-sizing:border-box;background:#F1EADA;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;">
        <img src="../images/journal/weekly-reflection.svg" alt="" style="width:64px;height:64px;border-radius:17px;display:block;">
        <span style="font-size:15px;font-weight:700;color:#18160F;line-height:1.25;">Weekly Reflection</span>
      </a>
      <a href="Expressions.dc.html" style="text-decoration:none;aspect-ratio:1;box-sizing:border-box;background:#F1EADA;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;">
        <img src="../images/journal/expressions.svg" alt="" style="width:64px;height:64px;border-radius:17px;display:block;">
        <span style="font-size:15px;font-weight:700;color:#18160F;line-height:1.25;">Expressions</span>
      </a>
    </div>

  </div>

  <div style="flex-shrink:0;display:flex;border-top:1px solid #E7DFCB;background:#FFFFFF;">
    <a href="Home.dc.html" style="text-decoration:none;flex:1;padding:10px 0 8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V20H4V11Z" stroke="#837C6D" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span style="font-size:10.5px;font-weight:600;color:#837C6D;">Home</span>
    </a>
    <div style="flex:1;padding:10px 0 8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5.5C6 4.5 9 4.5 12 6C15 4.5 18 4.5 20 5.5V18C18 17 15 17 12 18.5C9 17 6 17 4 18V5.5Z" stroke="#2F6B5E" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6V18.5" stroke="#2F6B5E" stroke-width="1.8"/></svg>
      <span style="font-size:10.5px;font-weight:700;color:#2F6B5E;">Journal</span>
    </div>
    <a href="Insights.dc.html" style="text-decoration:none;flex:1;padding:10px 0 8px 0;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 19V13" stroke="#837C6D" stroke-width="1.8" stroke-linecap="round"/><path d="M12 19V6" stroke="#837C6D" stroke-width="1.8" stroke-linecap="round"/><path d="M19 19V10" stroke="#837C6D" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span style="font-size:10.5px;font-weight:600;color:#837C6D;">Insights</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Quotes shown for the last `quoteDays` days; more load as you swipe back.
    this.state = { quoteDays: 14, quoteIndex: 0 };
  }
  componentDidMount() {
    quotes.refresh(this.state.quoteDays);
  }
  renderVals() {
    const s = this.state;
    const today = db.today();

    // Quote of the day carousel (lib/quotes.js).
    const list = quotes.list(s.quoteDays);
    const quoteSlides = list.length
      ? list.map((q) => ({
          label: q.date === today ? 'QUOTE OF THE DAY' : db.format(q.date, { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase(),
          text: q.text,
          by: '—Sadhguru',
        }))
      : [{ label: 'QUOTE OF THE DAY', text: navigator.onLine === false ? 'Today\u2019s quote will appear here when you\u2019re online.' : 'Loading today\u2019s quote\u2026', by: '' }];
    const index = Math.min(s.quoteIndex, quoteSlides.length - 1);
    const scrollToSlide = (i) => {
      const el = document.querySelector('[data-quotes]');
      if (el) el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
    };
    const onQuotesScroll = (e) => {
      const el = e.currentTarget;
      const i = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
      if (i !== this.state.quoteIndex) this.setState({ quoteIndex: i });
      // Close to the oldest quote loaded so far: fetch two more weeks (up to about three months).
      const days = this.state.quoteDays;
      if (i >= list.length - 2 && list.length && days < 90 && days - list.length < 3) {
        this.setState({ quoteDays: days + 14 });
        quotes.refresh(days + 14);
      }
    };

    // This month's entries of each kind, counted by the day they were written (as Past Entries groups them).
    const monthStart = today.slice(0, 8) + '01';
    const thisMonth = (type) => db.list(type, {
      where: (e) => {
        const day = db.iso(new Date(e.ts));
        return day >= monthStart && day <= today;
      },
    }).length;
    const expressionCount = thisMonth('expression');

    // My Commitment (saved by CommitmentLetter.dc.html as kv 'commitment').
    const c = db.get('commitment', null);
    const anchor = c && c.anchors && c.anchors[0];
    const long = (d) => db.format(d, { month: 'short', day: 'numeric', year: 'numeric' });

    return {
      dailyCount: thisMonth('daily-reflection'),
      weeklyCount: thisMonth('weekly-reflection'),
      expressionCount,
      expressionLabel: expressionCount === 1 ? 'Expression' : 'Expressions',
      commitStatus: c && c.signed ? 'Signed ' + (c.signedOn ? long(c.signedOn) : '') : 'Not signed yet',
      commitPreview: anchor ? '“' + anchor + '”' : 'Write a letter to yourself to come back to on hard days.',
      quoteSlides,
      onQuotesScroll,
      quoteHint: index === 0 ? (quoteSlides.length > 1 ? 'Swipe for earlier quotes' : '') : (index + 1) + ' of ' + quoteSlides.length,
      quotePrev: () => scrollToSlide(Math.max(0, index - 1)),
      quoteNext: () => scrollToSlide(Math.min(quoteSlides.length - 1, index + 1)),
      quotePrevOpacity: index === 0 ? 0.35 : 1,
      quoteNextOpacity: index >= quoteSlides.length - 1 ? 0.35 : 1,
    };
  }
}
</script>
</body>
</html>
